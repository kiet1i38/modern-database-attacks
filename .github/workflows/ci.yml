name: CampusDesk four-site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: npm run test:integration
        env:
          EVIDENCE_DIR: evidence/ci-api
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campusdesk-api-evidence
          path: evidence/ci-api/
      - run: docker compose down
        if: always()
